services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ust_agent
      POSTGRES_USER: ust_agent
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ust_agent -d ust_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-server:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ust_agent:changeme@postgres:5432/ust_agent
      NEXTAUTH_SECRET: changeme-nextauth-secret
      SALT: changeme-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Seed a default org/project/user on first boot so CI and local dev
      # can use predictable API keys without manual UI setup.
      LANGFUSE_INIT_ORG_ID: ust-org
      LANGFUSE_INIT_ORG_NAME: UST
      LANGFUSE_INIT_PROJECT_ID: ust-coding-agent
      LANGFUSE_INIT_PROJECT_NAME: ust-coding-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-ust-coding-agent-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-ust-coding-agent-local
      LANGFUSE_INIT_USER_EMAIL: admin@ust-agent.local
      LANGFUSE_INIT_USER_PASSWORD: UstAgent2024!
      LANGFUSE_INIT_USER_NAME: UST Admin

volumes:
  pgdata:
