[project]
name = "ust-coding-agent"
version = "0.1.0"
description = "UST Coding Agent — model-neutral, governed coding agent built on DeepAgents"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0,<2.0.0",
    "deepagents==0.6.8",
    "langchain-litellm>=0.2.0",
    "langfuse>=2.0.0,<3.0.0",
    "litellm>=1.72.0,<2.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "tree-sitter>=0.23.0,<1.0.0",
    "tree-sitter-python>=0.23.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
ust-agent = "ust_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ust_agent"]

[tool.uv]
package = true
