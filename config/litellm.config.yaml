# LiteLLM model group definitions — AWS Bedrock backend.
# All groups use cross-region inference profiles (required for Claude 4.x).
# Auth comes from the genai-agent-user AWS profile — no API keys stored here.

model_list:
  # ── frontier ────────────────────────────────────────────────────────────────
  # Claude Sonnet 4.6 (US cross-region inference profile)
  - model_name: frontier
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      aws_profile_name: genai-agent-user
      aws_region_name: us-east-1

  # ── mid ─────────────────────────────────────────────────────────────────────
  # Claude Sonnet 4.5 — balanced capability/cost
  - model_name: mid
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_profile_name: genai-agent-user
      aws_region_name: us-east-1

  # ── cheap ───────────────────────────────────────────────────────────────────
  # Claude Haiku 4.5 — fast and low-cost for embeddings and summaries
  - model_name: cheap
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_profile_name: genai-agent-user
      aws_region_name: us-east-1

  # ── private ─────────────────────────────────────────────────────────────────
  # For data-class: restricted — must stay on-prem / local inference only.
  - model_name: private
    litellm_params:
      model: ollama/llama3.2
      api_base: os.environ/PRIVATE_MODEL_ENDPOINT

litellm_settings:
  request_timeout: 120
