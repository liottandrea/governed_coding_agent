<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{CSS_URI}} 'unsafe-inline'; script-src {{JS_URI}};" />
  <link rel="stylesheet" href="{{CSS_URI}}" />
  <title>Governed Coding Agent</title>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="header-left">
      <svg class="logo" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="7" width="18" height="13" rx="2.5"/>
        <rect x="6.5" y="10" width="4" height="4" rx="1" fill="var(--vscode-editor-background)"/>
        <rect x="13.5" y="10" width="4" height="4" rx="1" fill="var(--vscode-editor-background)"/>
        <line x1="12" y1="7" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="2.8" r="1.5" fill="currentColor"/>
      </svg>
      <span class="title">Governed Coding Agent</span>
    </div>
    <div class="header-right">
      <button id="btnSettings" class="hdr-btn" title="Toggle settings">Settings</button>
      <button id="btnNew" class="hdr-btn accent" title="Start a new session">+ New</button>
    </div>
  </div>

  <div id="settings" class="collapsed">
    <div class="settings-row">
      <div class="setting-group">
        <span class="setting-label">Data class</span>
        <select id="dataClass">
          <option value="public">public</option>
          <option value="internal" selected>internal</option>
          <option value="restricted">restricted</option>
        </select>
      </div>
      <div class="setting-group">
        <span class="setting-label">Role</span>
        <select id="role">
          <option value="planner" selected>planner</option>
          <option value="codegen">codegen</option>
        </select>
      </div>
      <div class="setting-group toggle-group">
        <input type="checkbox" id="knowledge" checked />
        <span class="setting-label">Knowledge</span>
      </div>
    </div>
    <div class="settings-row">
      <div class="setting-group">
        <span class="setting-label">Planner model</span>
        <select id="plannerModel">
          <option value="cheap">Haiku  (cheap)</option>
          <option value="mid" selected>Sonnet  (mid)</option>
          <option value="frontier">Sonnet 4.6  (frontier)</option>
          <option value="local_fast">phi4-mini  (local fast)</option>
          <option value="local_standard">devstral  (local std)</option>
          <option value="local_heavy">qwen 35B  (local heavy)</option>
        </select>
      </div>
      <div class="setting-group">
        <span class="setting-label">Subagent model</span>
        <select id="subagentModel">
          <option value="cheap" selected>Haiku  (cheap)</option>
          <option value="mid">Sonnet  (mid)</option>
          <option value="frontier">Sonnet 4.6  (frontier)</option>
          <option value="local_fast">phi4-mini  (local fast)</option>
          <option value="local_standard">devstral  (local std)</option>
          <option value="local_heavy">qwen 35B  (local heavy)</option>
        </select>
      </div>
    </div>
    <div class="settings-row">
      <div class="setting-group full">
        <span class="setting-label">System prompt override</span>
        <textarea id="systemPrompt" rows="3" placeholder="Leave blank to use the default prompt…"></textarea>
      </div>
    </div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <textarea id="msgInput" rows="1" placeholder="Describe a coding task…"></textarea>
    <div id="inputFooter">
      <span id="modelPill" class="model-pill"></span>
      <button id="btnSend">Send &rarr;</button>
    </div>
  </div>

  <div id="statusBar">
    <span id="sessionId">No active session</span>
    <a id="traceLink" href="#" style="display:none" target="_blank">View trace &nearr;</a>
  </div>

</div>
<script src="{{JS_URI}}"></script>
</body>
</html>
